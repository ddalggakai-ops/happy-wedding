<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>포토 빙고 · 김형규 ♥ 방현진</title>
  <meta name="description" content="아홉 개의 미션 사진을 채우고 경품에 응모하세요" />

  <!-- Open Graph (QR·링크 공유 시 미리보기) -->
  <meta property="og:title" content="포토 빙고 · 김형규 ♥ 방현진" />
  <meta property="og:description" content="아홉 개의 미션 사진을 채우고 경품에 응모하세요" />
  <meta property="og:image" content="https://hyeongkyu-and-hyunjin.life/assets/cover.jpg" />
  <meta property="og:url" content="https://hyeongkyu-and-hyunjin.life/bingo.html" />
  <meta property="og:type" content="website" />

  <!-- 폰트 (청첩장과 동일) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Imperial+Script&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="invitation">

    <!-- 페이지 머리말 -->
    <header class="bingo-page__head">
      <p class="bingo-page__label">PHOTO BINGO</p>
      <h1 class="bingo-page__names" id="page-names"></h1>
      <p class="bingo-page__date" id="page-date"></p>
    </header>

    <section class="section snap" id="snap-section">
      <h2 class="section__title reveal" id="bingo-title"></h2>
      <p class="snap__desc reveal" id="bingo-desc"></p>
      <p class="bingo__notice" id="bingo-notice" hidden></p>

      <!-- 3×3 미션 판 (칸은 config.bingo.cells 로 생성) -->
      <div class="bingo__grid reveal" id="bingo-grid"></div>
      <p class="bingo__status" id="bingo-status"></p>

      <!-- 응모 정보 -->
      <form class="bingo__form reveal" id="bingo-form">
        <div class="form-row form-row--pair">
          <label class="chip"><input type="radio" name="bingo-side" value="신랑측" checked /><span>신랑측</span></label>
          <label class="chip"><input type="radio" name="bingo-side" value="신부측" /><span>신부측</span></label>
        </div>
        <div class="form-row">
          <input type="text" id="bingo-name" placeholder="성함" maxlength="20" required />
          <input type="tel" id="bingo-phone" placeholder="연락처" maxlength="20" required />
        </div>
        <button type="submit" class="btn btn--fill" id="bingo-submit" disabled>한 줄을 먼저 완성해주세요</button>
        <p class="bingo__note" id="bingo-note"></p>
      </form>

      <p class="bingo__done" id="bingo-done" hidden></p>

      <!-- 완성한 빙고판 콜라주 -->
      <div class="bingo__collage" id="bingo-collage" hidden>
        <img id="collage-img" alt="완성한 포토 빙고판" />
        <button type="button" class="btn btn--fill" id="collage-save">빙고판 이미지 저장하기</button>
        <p class="bingo__collage-note">저장이 안 되면 이미지를 길게 눌러 저장해주세요.</p>
      </div>

      <!-- 빙고와 상관없이 사진만 올리고 싶을 때 -->
      <div class="bingo__extra reveal" id="bingo-extra">
        <p class="bingo__extra-desc">빙고와 상관없이, 오늘 담아주신 사진을<br/>자유롭게 올려주셔도 좋습니다.</p>
        <label class="btn btn--outline bingo__free" id="bingo-free">
          📷 사진 올리기 (최대 100장)
          <input type="file" id="snap-input" accept="image/*" multiple hidden />
        </label>
      </div>

      <!-- 빙고 칸 촬영용 (칸을 누르면 열립니다) -->
      <input type="file" id="bingo-input" accept="image/*" hidden />
      <p class="snap__status" id="snap-status"></p>
    </section>

    <footer class="bingo-page__foot">
      <a class="bingo-page__back" id="page-back" href="index.html">← 청첩장으로 돌아가기</a>
    </footer>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/bingo.js"></script>
</body>
</html>
